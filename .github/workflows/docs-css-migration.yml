name: One-shot docs CSS architecture migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-css-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Migrate docs authoring to source CSS
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const docsDir = 'docs';
          let changed = 0;
          for (const name of fs.readdirSync(docsDir)) {
            if (!name.endsWith('.html')) continue;
            const file = path.join(docsDir, name);
            const before = fs.readFileSync(file, 'utf8');
            const after = before.replaceAll('../packages/core/dist/reeris.css', '../packages/core/src/reeris.css');
            if (after !== before) {
              fs.writeFileSync(file, after);
              changed++;
            }
          }

          const generator = 'tooling/generate-api-reference.mjs';
          if (fs.existsSync(generator)) {
            const before = fs.readFileSync(generator, 'utf8');
            const after = before.replaceAll('../packages/core/dist/reeris.css', '../packages/core/src/reeris.css');
            fs.writeFileSync(generator, after);
          }

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.scripts ||= {};
          pkg.scripts['docs:site'] = 'npm run build && node tooling/build-docs-site.mjs';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const ignorePath = '.gitignore';
          let ignore = fs.existsSync(ignorePath) ? fs.readFileSync(ignorePath, 'utf8') : '';
          if (!ignore.includes('.reeris-docs-site/')) {
            if (ignore && !ignore.endsWith('\n')) ignore += '\n';
            ignore += '.reeris-docs-site/\n';
            fs.writeFileSync(ignorePath, ignore);
          }

          fs.writeFileSync('tooling/build-docs-site.mjs', `import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const out = path.join(root, '.reeris-docs-site');
          const docsOut = path.join(out, 'docs');

          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(out, { recursive: true });

          fs.cpSync(path.join(root, 'docs'), docsOut, { recursive: true });

          const builtCss = path.join(root, 'packages/core/dist/reeris.css');
          if (!fs.existsSync(builtCss)) {
            throw new Error('packages/core/dist/reeris.css is missing. Run npm run build first.');
          }
          fs.copyFileSync(builtCss, path.join(docsOut, 'assets/reeris.css'));

          for (const name of fs.readdirSync(docsOut)) {
            if (!name.endsWith('.html')) continue;
            const file = path.join(docsOut, name);
            const html = fs.readFileSync(file, 'utf8')
              .replaceAll('../packages/core/src/reeris.css', 'assets/reeris.css');
            fs.writeFileSync(file, html);
          }

          if (fs.existsSync(path.join(root, 'examples'))) {
            fs.cpSync(path.join(root, 'examples'), path.join(out, 'examples'), { recursive: true });
          }
          fs.mkdirSync(path.join(out, 'packages/core/dist'), { recursive: true });
          fs.copyFileSync(builtCss, path.join(out, 'packages/core/dist/reeris.css'));

          fs.writeFileSync(path.join(out, 'index.html'),
            '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=docs/index.html"><title>Reeris UI Docs</title></head><body><a href="docs/index.html">Open Reeris UI documentation</a></body></html>\n'
          );

          console.log('Built self-contained docs site at .reeris-docs-site/');
          `);

          fs.writeFileSync('docs/README.md', `# Reeris UI documentation architecture

          Documentation checked into the repository uses the canonical source entrypoint:

          \`../packages/core/src/reeris.css\`

          This keeps a fresh clone browsable without requiring generated \`dist/\` files.

          The published documentation site is built with:

          \`npm run docs:site\`

          That command first builds Reeris, then creates \`.reeris-docs-site/\`. During that build, documentation pages are rewritten to use a self-contained \`docs/assets/reeris.css\` copied from the production \`packages/core/dist/reeris.css\`.

          This deliberately separates concerns:

          - repository docs validate the standards-native source modules;
          - package/release tests validate \`dist/reeris.css\`;
          - published docs consume a self-contained copy of the tested distribution build.
          `);

          fs.rmSync('.github/workflows/docs-css-migration.yml', { force: true });
          console.log(`Updated ${changed} documentation HTML files.`);
          NODE
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi
          git commit -m "Decouple docs authoring from generated dist CSS"
          git push
