<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reeris UI — Toolbar, Filters & Search</title><link rel="stylesheet" href="../packages/core/dist/reeris.css"><style>body{padding:2rem}.demo{max-width:75rem;margin:auto}.demo-section{margin-block:2rem}.icon{font-size:1rem}</style></head><body><main class="demo l-stack" style="--reeris-stack-gap:2rem">
<header class="page-header"><div class="page-header-main"><h1 class="page-title">Reservations</h1><p class="page-description">Manage bookings, search guests and refine the current data view.</p></div><div class="page-header-actions"><button class="btn outline">Export</button><button class="btn primary">New reservation</button></div></header>
<section class="demo-section l-stack"><h2>Command & filter bar</h2><div class="filter-bar"><label class="search-field"><span class="sr-only">Search reservations</span><span class="search-field-icon" aria-hidden="true">⌕</span><input type="search" placeholder="Search reservations"></label><div class="filter-group"><button class="btn outline sm">Status</button><button class="btn outline sm">Dates</button><button class="btn outline sm">Guests</button></div><div class="view-controls end"><span class="command-label">View</span><div class="view-switcher"><button class="btn ghost sm" aria-pressed="true">List</button><button class="btn ghost sm">Grid</button></div></div></div></section>
<section class="demo-section l-stack"><h2>Active filters</h2><ul class="filter-chips"><li><span class="filter-chip active">Confirmed <span class="filter-chip-count">24</span><button class="filter-chip-remove" aria-label="Remove Confirmed filter">×</button></span></li><li><span class="filter-chip">October <button class="filter-chip-remove" aria-label="Remove October filter">×</button></span></li><li><button class="filter-chip" aria-pressed="false">VIP guests</button></li></ul></section>
<section class="demo-section l-stack"><h2>Bulk actions</h2><div class="bulk-actions" data-reeris-state="active"><span class="bulk-actions-count">3 selected</span><div class="bulk-actions-group"><button class="btn outline sm">Assign</button><button class="btn outline sm">Export</button><button class="btn danger sm">Delete</button></div></div></section>
<section class="demo-section"><div class="data-table"><div class="data-table-toolbar"><strong>Recent reservations</strong></div><div class="table-responsive"><table class="table hover"><thead><tr><th>Guest</th><th>Status</th><th class="numeric">Total</th></tr></thead><tbody><tr><td>Alex Morgan</td><td><span class="badge success">Confirmed</span></td><td class="numeric">€4,200</td></tr><tr><td>Sam Lee</td><td><span class="badge warning">Pending</span></td><td class="numeric">€2,850</td></tr></tbody></table></div></div></section>
</main></body></html>
