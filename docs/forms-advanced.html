<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reeris UI — Advanced Forms</title><link rel="stylesheet" href="../packages/core/src/reeris.css"><style>body{max-width:70rem;margin:auto;padding:2rem}.demo{display:grid;gap:2rem}.panel{padding:1.5rem;border:1px solid var(--reeris-color-border);border-radius:var(--reeris-radius-lg)}h1,h2{margin-block-start:0}</style></head><body>
<h1>Reeris UI 0.6 — Advanced Forms</h1><div class="demo">
<section class="panel l-stack"><h2>Search, password & decorated fields</h2><label class="field"><span class="field-label">Search</span><span class="input-wrap has-start"><span class="input-decor start" aria-hidden="true">⌕</span><input class="input" type="search" placeholder="Search records"></span></label><label class="field"><span class="field-label">Password</span><span class="input-wrap has-end"><input class="input" type="password" value="correct-horse-battery"><button class="input-action" type="button" aria-label="Show password">◉</button></span></label><div class="strength" data-reeris-strength="good"><div class="strength-track" aria-hidden="true"><span></span><span></span><span></span><span></span></div><span class="strength-label">Password strength: good</span></div></section>
<section class="panel l-stack"><h2>Date, time & color</h2><div class="form-row"><label class="field"><span class="field-label">Date</span><input class="input" type="date"></label><label class="field"><span class="field-label">Time</span><input class="input" type="time"></label><label class="field"><span class="field-label">Color</span><input class="color-input" type="color" value="#4f46e5"></label></div></section>
<section class="panel l-stack"><h2>Range</h2><label class="field"><span class="field-label">Volume</span><input class="range" type="range" min="0" max="100" value="62"><span class="field-help">Native range semantics with progressive Reeris styling.</span></label></section>
<section class="panel l-stack"><h2>File input & drop-zone presentation</h2><label class="field"><span class="field-label">Attachment</span><input class="file" type="file"></label><label class="dropzone"><strong>Drop files here</strong><span>or choose a file</span><input class="file" type="file" multiple></label></section>
<section class="panel l-stack"><h2>OTP / PIN</h2><div class="otp" aria-label="Verification code"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 1"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 2"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 3"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 4"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 5"><input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 6"></div></section>
<section class="panel l-stack"><h2>Validation & loading presentation</h2><label class="field"><span class="field-label">Email</span><input class="input" type="email" aria-invalid="true" aria-describedby="email-error" value="wrong@"><span class="field-error field-status" id="email-error">Enter a valid email address.</span></label><label class="field" data-reeris-state="loading"><span class="field-label">Company</span><input class="input" value="Searching…" aria-busy="true"></label></section>
</div></body></html>
