<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reeris UI — Forms 0.5</title><link rel="stylesheet" href="../packages/core/dist/reeris.css"><style>body{padding:2rem}.demo{max-inline-size:52rem;margin-inline:auto}.section{padding:1.5rem;border:1px solid var(--reeris-color-border);border-radius:var(--reeris-radius-lg);background:var(--reeris-color-surface)}</style></head><body><main class="demo l-stack" style="--reeris-stack-gap:2rem"><header><h1>Reeris Forms</h1><p>Foundation 0.5 smoke test.</p></header><section class="section l-stack"><h2>Text controls</h2><div class="form-row"><label class="field"><span class="field-label">Name <span class="required">*</span></span><input class="input" required placeholder="Revaz Eristavi"><span class="field-help">Your public display name.</span></label><label class="field"><span class="field-label">Country</span><select class="select"><option>Cyprus</option><option>Greece</option><option>Belgium</option></select></label></div><label class="field"><span class="field-label">About</span><textarea class="textarea" placeholder="Tell us something"></textarea></label><label class="field"><span class="field-label">Server error</span><input class="input" value="taken@example.com" aria-invalid="true" aria-describedby="email-error"><span class="field-error" id="email-error">This email is already in use.</span></label></section><section class="section l-stack"><h2>Choices</h2><label class="choice"><input type="checkbox" checked> Email notifications</label><label class="choice"><input type="radio" name="plan" checked> Standard plan</label><label class="choice"><input type="radio" name="plan"> Pro plan</label><label class="switch"><input type="checkbox" role="switch" checked> Enable automatic updates</label></section><section class="section l-stack"><h2>Groups & floating labels</h2><div class="input-group"><span class="input-addon">€</span><input class="input" type="number" value="3500" aria-label="Amount in euros"><button class="btn primary">Save</button></div><label class="field floating"><input class="input" placeholder=" " autocomplete="email"><span class="field-label">Email address</span></label></section><section class="section l-stack"><h2>States & sizes</h2><input class="input xs" value="Extra small" aria-label="Extra small input"><input class="input sm" value="Small" aria-label="Small input"><input class="input" value="Default" aria-label="Default size input"><input class="input lg" value="Large" aria-label="Large input"><input class="input xl" value="Extra large" aria-label="Extra large input"><input class="input" value="Read-only value" aria-label="Read-only example" readonly><input class="input" value="Disabled value" aria-label="Disabled example" disabled></section></main></body></html>
