<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width"><title>Reeris Search & Command</title><link rel="stylesheet" href="../packages/core/src/reeris.css"></head><body><main class="l-stack" style="max-width:52rem;margin:auto;padding:2rem"><h1>Search, Command & Selection</h1><section class="command-palette"><div class="command-search"><input class="field" type="search" placeholder="Search commands…" aria-label="Search commands"></div><div class="command-body"><div class="command-group"><div class="command-group-title">Navigation</div><a class="command-item" href="#"><span class="command-icon">⌂</span><span class="command-content"><span class="command-label">Dashboard</span><span class="command-description">Open your main workspace</span></span><span class="command-meta"><kbd class="kbd">G</kbd> <kbd class="kbd">D</kbd></span></a><button class="command-item" aria-selected="true"><span class="command-icon">⌕</span><span class="command-content"><span class="command-label">Search customers</span><span class="command-description">Find a customer by name or email</span></span><kbd class="kbd">↵</kbd></button></div><div class="command-group"><div class="command-group-title">Recent</div><button class="command-item"><span class="command-icon">◷</span><span class="command-content"><span class="command-label">Quarterly report</span></span><span class="command-meta">2m ago</span></button></div></div><footer class="command-footer"><span><kbd class="kbd">↑</kbd> <kbd class="kbd">↓</kbd> navigate</span><span><kbd class="kbd">Esc</kbd> close</span></footer></section><h2>Combobox presentation</h2><div class="combobox" style="max-width:28rem"><input class="field" role="combobox" aria-expanded="true" aria-controls="cities" value="Pa" aria-label="Choose a city"><div class="combobox-panel" id="cities"><div class="combobox-list" role="listbox"><div class="combobox-option" role="option" aria-selected="true"><span class="combobox-option-check">✓</span><span class="result-content"><span class="result-title"><mark class="search-highlight">Pa</mark>phos</span><span class="result-description">Cyprus</span></span></div><div class="combobox-option" role="option"><span class="combobox-option-check">✓</span><span class="result-content"><span class="result-title"><mark class="search-highlight">Pa</mark>ris</span><span class="result-description">France</span></span></div></div></div></div></main></body></html>
