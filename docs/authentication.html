<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reeris UI — Authentication & Onboarding</title><link rel="stylesheet" href="../packages/core/dist/reeris.css"></head><body>
<main class="auth-shell">
<section class="auth-brand"><div class="auth-brand-content"><span class="badge">Reeris UI</span><h1 class="auth-brand-title">Welcome back.</h1><p class="auth-brand-copy">Native, accessible account-entry patterns built on the same Reeris foundation.</p></div></section>
<section class="auth-main"><div class="auth-card"><header class="auth-header"><h2 class="auth-title">Sign in</h2><p class="auth-description">Use your account details to continue.</p></header>
<form class="auth-form"><label><span class="field-label">Email</span><input class="field" type="email" autocomplete="email" required></label><label><span class="field-label">Password</span><input class="field" type="password" autocomplete="current-password" required></label><div class="auth-options"><label><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div><button class="btn primary auth-submit" type="submit">Sign in</button></form>
<div class="auth-divider">or</div><div class="auth-providers"><button class="btn outline">Provider</button><button class="btn outline">SSO</button></div><p class="auth-footer">New here? <a href="#">Create an account</a></p></div></section></main>
<section class="auth-main"><div class="onboarding"><div class="onboarding-header"><span class="badge primary">Onboarding</span><h2>Set up your workspace</h2><div class="onboarding-progress" style="--reeris-onboarding-steps:4" aria-label="Step 2 of 4"><span class="complete"></span><span aria-current="step"></span><span></span><span></span></div></div><div class="onboarding-panel"><h3>How will you use Reeris?</h3><div class="onboarding-choices"><label class="onboarding-choice"><input type="radio" name="use" checked><strong>Application</strong><span>Dashboards and internal tools</span></label><label class="onboarding-choice"><input type="radio" name="use"><strong>Website</strong><span>Marketing and content</span></label></div><div class="onboarding-actions"><button class="btn outline">Back</button><button class="btn primary">Continue</button></div></div></div></section>
</body></html>
