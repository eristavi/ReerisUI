<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width"><title>Reeris Files</title><link rel="stylesheet" href="../packages/core/dist/reeris.css"></head><body><main class="l-stack" style="max-width:60rem;margin:auto;padding:2rem"><h1>Files & uploads</h1><section class="dropzone"><div class="dropzone-content"><strong class="dropzone-title">Drop files here</strong><p class="dropzone-description">or choose files from your device</p><input type="file" multiple aria-label="Choose files to upload"></div></section><section class="file-browser"><header class="file-browser-header"><strong>Project files</strong><button class="btn primary sm">Upload</button></header><ul class="file-list"><li class="file-row"><span class="file-icon" aria-hidden="true">PDF</span><div class="file-content"><p class="file-name">proposal.pdf</p><div class="file-meta"><span>2.4 MB</span><span>Today</span></div></div><div class="file-actions"><button class="btn ghost sm">Open</button></div></li><li class="file-row" aria-selected="true"><span class="file-icon" aria-hidden="true">IMG</span><div class="file-content"><p class="file-name">hero-image.jpg</p><div class="file-meta"><span>5.1 MB</span><span>Yesterday</span></div></div><div class="file-actions"><button class="btn ghost sm">Open</button></div></li></ul><footer class="file-browser-footer">2 files <span>7.5 MB</span></footer></section><section><h2>Upload queue</h2><ul class="upload-queue"><li class="upload-item"><span class="file-icon">ZIP</span><div class="upload-status"><p class="file-name">assets.zip</p><div class="progress"><div class="progress-bar" style="width:62%"></div></div></div><button class="btn ghost sm">Cancel</button></li><li class="upload-item" data-reeris-state="error"><span class="file-icon">MOV</span><div class="upload-status"><p class="file-name">video.mov</p><div class="upload-error">Upload failed. Try again.</div></div><button class="btn outline sm">Retry</button></li></ul></section></main></body></html>
