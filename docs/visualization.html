<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reeris UI — Metrics & Visualization</title><link rel="stylesheet" href="../packages/core/dist/reeris.css"><style>body{padding:2rem}.demo{max-width:70rem;margin:auto}.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}</style></head><body><main class="demo l-stack"><header><h1>Metrics & Visualization</h1><p>CSS presentation primitives; application/chart libraries own data and plotting logic.</p></header><section class="demo-grid"><article class="metric"><div class="metric-header"><span class="metric-label">Revenue</span><span class="trend up">+12.4%</span></div><strong class="metric-value">€284,900</strong><div class="sparkline" aria-label="Rising trend"><i style="--reeris-value:25%"></i><i style="--reeris-value:40%"></i><i style="--reeris-value:35%"></i><i style="--reeris-value:62%"></i><i style="--reeris-value:80%"></i></div><span class="metric-comparison">vs previous period</span></article><article class="metric"><span class="metric-label">Occupancy</span><div class="viz-ring" style="--reeris-value:85%"><strong class="viz-ring-value">85%</strong></div></article></section><section class="chart"><div class="chart-header"><h2 class="chart-title">Channel performance</h2><span class="badge">Presentation only</span></div><div class="viz-bar"><div class="viz-bar-row"><span class="viz-bar-label">Direct</span><div class="viz-bar-track"><div class="viz-bar-fill" style="--reeris-value:78%"></div></div><span class="viz-bar-value">78%</span></div><div class="viz-bar-row"><span class="viz-bar-label">Partners</span><div class="viz-bar-track"><div class="viz-bar-fill accent" style="--reeris-value:54%"></div></div><span class="viz-bar-value">54%</span></div><div class="viz-bar-row"><span class="viz-bar-label">Other</span><div class="viz-bar-track"><div class="viz-bar-fill success" style="--reeris-value:32%"></div></div><span class="viz-bar-value">32%</span></div></div><ul class="chart-legend"><li class="legend-item"><i class="legend-swatch"></i>Direct</li><li class="legend-item"><i class="legend-swatch" style="--reeris-viz-color:var(--reeris-color-accent)"></i>Partners</li></ul></section><section class="chart"><div class="chart-header"><h2 class="chart-title">Chart container</h2></div><div class="chart-body" role="img" aria-label="Empty chart surface for application visualization"></div></section></main></body></html>
